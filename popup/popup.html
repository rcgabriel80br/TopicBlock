<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>TopicBlock</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>🛡 TopicBlock</h1>
        </header>
        <!-- General filter -->
        <section class="card">
            <div class="sectionTitle" data-i18n="generalFilter">
                General
            </div>
            <div class="general-setting-row">
                <div class="general-setting-copy">
                    <span id="extensionControlLabel" data-i18n="extensionControl">
                        Extension
                    </span>
                    <span id="toggleText" class="toggleText">
                        Enabled
                    </span>
                </div>
                <label class="switch">
                    <input
                        type="checkbox"
                        id="toggle"
                        aria-labelledby="extensionControlLabel"
                    >
                    <span class="slider"></span>
                </label>
            </div>
            <div class="general-setting-row">
                <span id="showBlockReasonLabel" data-i18n="showBlockReason">
                    Show block reason
                </span>
                <label class="switch">
                    <input
                        type="checkbox"
                        id="showBlockReason"
                        aria-labelledby="showBlockReasonLabel"
                    >
                    <span class="slider"></span>
                </label>
            </div>
            <div class="general-action-row">
                <button id="showUnfilteredPage" class="secondary page-action">
                    👁 <span data-i18n="viewOriginalPage">View original page</span>
                </button>
            </div>
        </section>
        <!-- Groups -->
        <section class="card">
            <div class="sectionTitle" data-i18n="groups">
                Groups
            </div>
            <div id="groupList"></div>
        </section>
        <!-- Custom words -->
        <section class="card">
            <div class="sectionTitle">
                <span data-i18n="customWords">Custom words</span>
                <span id="wordCount"></span>
            </div>
            <ul id="wordList"></ul>
        </section>
        <!-- New word -->
        <section class="card">
            <div class="sectionTitle" data-i18n="newWord">
                New word
            </div>
            <input
                id="newWord"
                type="text"
                placeholder="Enter a word..."
                data-i18n-placeholder="enterWordPlaceholder"
            >
            <button id="addWord" class="primary" data-i18n="add">
                Add
            </button>
        </section>
        <!-- Hibernated words -->
        <section class="card">
            <div class="sectionTitle">
                <span data-i18n="hibernated">Hibernated</span>
                <span id="hibernateCount"></span>
            </div>
            <ul id="hibernateList" class="hibernateList"></ul>
        </section>
        <!-- New hibernation -->
        <section class="card">
            <div class="sectionTitle" data-i18n="newHibernation">
                New hibernation
            </div>
            <input
                id="hibernateWord"
                type="text"
                placeholder="Enter a word..."
                data-i18n-placeholder="enterWordPlaceholder"
            >
            <div class="buttonRow">
                <button id="hibernate7" class="primary">
                    7 days
                </button>
                <button id="hibernate15" class="primary">
                    15 days
                </button>
                <button id="hibernate30" class="primary">
                    30 days
                </button>
            </div>
        </section>
        <!-- Ignored sites -->
        <section class="card">
            <div class="sectionTitle">
                <span data-i18n="ignoredSites">Ignored sites</span>
                <span id="ignoredSitesCount"></span>
            </div>
            <button
                id="ignoreCurrentSite"
                class="secondary current-site-action"
                data-i18n="ignoreThisSite"
            >
                Ignore this site
            </button>
            <div
                id="currentSiteMessage"
                class="current-site-message"
                role="status"
            ></div>
            <ul id="ignoredSitesList"></ul>
            <input id="newIgnoredSite" type="text" placeholder="chatgpt.com">
            <button id="addIgnoredSite" class="primary" data-i18n="add">
                Add
            </button>
        </section>
        <!-- Statistics -->
        <section class="card">
            <div class="sectionTitle" data-i18n="statistics">
                Statistics
            </div>
            <div>
                <span data-i18n="thisSession">This session:</span>
                <strong id="blockedSession">
                    0
                </strong>
            </div>
            <div>
                <span data-i18n="totalBlocked">Total blocked:</span>
                <strong id="blockedTotal">
                    0
                </strong>
            </div>
        </section>
        <!-- Restore default lists -->
        <button id="resetWords" class="danger" data-i18n="restoreDefaultLists">
            Restore default lists
        </button>
        <footer class="popup-footer">
            <a href="mailto:topicblockapp@gmail.com">
                topicblockapp@gmail.com
            </a>
        </footer>
    </div>
    <script src="../js/shared/sites.js"></script>
    <script type="module" src="popup.js"></script>
</body>

</html>
